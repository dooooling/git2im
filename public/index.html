<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>git2im - GitHub IM Notification Gateway</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-inner">
        <a href="#/overview" class="brand">
          <div class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </div>
          <span class="brand-title">git2im</span>
        </a>

        <nav class="nav-tabs" id="nav-tabs">
          <button class="nav-tab active" data-tab="overview" id="nav-tab-overview">Overview</button>
          <button class="nav-tab" data-tab="targets" id="nav-tab-targets">Targets</button>
          <button class="nav-tab" data-tab="routes" id="nav-tab-routes">Routes</button>
          <button class="nav-tab" data-tab="settings" id="nav-tab-settings">Settings</button>
          <button class="nav-tab" data-tab="failures" id="nav-tab-failures">Failures</button>
          <button class="nav-tab" data-tab="export" id="nav-tab-export">Import/Export</button>
        </nav>

        <div class="header-actions">
          <button class="btn btn-sm" id="lang-switch-btn" title="Switch Language">EN / 中</button>
          <div id="auth-status-container"></div>
        </div>
      </div>
    </header>

    <main class="app-container" id="app-content">
      <div style="text-align: center; padding: 64px 0; color: var(--color-body-mid);">
        <p>Loading Dashboard...</p>
      </div>
    </main>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
